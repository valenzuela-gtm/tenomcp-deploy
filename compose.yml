# compose.yml — all-in-one Hostinger UI deploy stack.
#
# Both services (Volt MCP gateway + Nginx Proxy Manager) in a single Docker
# Compose project, designed to be served from a public URL and consumed by
# Hostinger Docker Manager's "Compose from URL" feature. Uses `image:`
# references only; no Docker build step required at deploy time.
#
# The Volt MCP image is built and published automatically by GitHub Actions
# (.github/workflows/build-and-publish-volt-mcp.yml in tenoro-hq) whenever the
# gateway source changes on main. The image lives at:
#
#   ghcr.io/valenzuela-gtm/volt-mcp:latest
#
# What this gateway does: it is a thin OAuth-terminating reverse proxy in front
# of VoltChat's own MCP server (https://mcp.voltchat.com/mcp). Claude web/mobile
# and ChatGPT can only connect via an OAuth login flow, which VoltChat does not
# offer — it only accepts a static API key. This gateway accepts the OAuth login
# (WorkOS AuthKit) and injects the Volt API key upstream, server-side.
#
# This file is ALSO the source-of-truth for the public deploy repo
# (https://github.com/valenzuela-gtm/tenomcp-deploy). Copy it verbatim to that
# repo when changes are made — Hostinger fetches the raw URL of that file.
#
# Full deploy runbook: README.md in this directory.

services:
  volt-mcp:
    image: ghcr.io/valenzuela-gtm/volt-mcp:latest
    container_name: volt-mcp
    restart: unless-stopped
    environment:
      # In a container with no published port, "all interfaces" is a
      # Docker-internal namespace only — safe and correct.
      BIND_HOST: 0.0.0.0
      NODE_ENV: production

      # Required — set this via the Docker Manager UI env-var panel.
      # Your Volt API key from https://app.voltchat.com/settings
      VOLT_API_KEY: ${VOLT_API_KEY}
      # Optional override; defaults to VoltChat's MCP endpoint.
      VOLT_MCP_URL: ${VOLT_MCP_URL:-https://mcp.voltchat.com/mcp}

      # Optional static bearer for your own CLI testing (curl, scripts). Claude
      # web / ChatGPT use OAuth below, not this.
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}

      # OAuth via WorkOS AuthKit — lets Claude web/mobile, ChatGPT, etc. connect
      # with a login flow. No WorkOS API key is needed: tokens are verified
      # locally against AuthKit's public JWKS. Set these via the Docker Manager UI.
      OAUTH_ENABLED: ${OAUTH_ENABLED:-false}
      AUTHKIT_DOMAIN: ${AUTHKIT_DOMAIN:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-https://reevomcp.galapago.cloud/mcp}
      # Authorization allowlist (who may connect via OAuth). Comma-separated.
      # FAIL-CLOSED: if OAuth is enabled but BOTH are empty, all OAuth logins
      # are rejected (only MCP_BEARER_TOKEN works). Requires the email claim in
      # the AuthKit JWT template (see runbook).
      OAUTH_ALLOWED_EMAILS: ${OAUTH_ALLOWED_EMAILS:-}
      OAUTH_ALLOWED_DOMAINS: ${OAUTH_ALLOWED_DOMAINS:-}

      # Production hardening defaults.
      LOG_LEVEL: info
      LOG_BODIES: "false"
      REDACT_EMAIL_VALUES: "true"
      TRUST_PROXY: "1"
      JSON_BODY_LIMIT: 1mb
      SHUTDOWN_GRACE_MS: "10000"
      PORT: "3000"
    expose:
      # Internal Docker network only — NOT published to host.
      - "3000"
    healthcheck:
      # node:22-alpine ships BusyBox; wget is available.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ready | grep -q '\"status\":\"ready\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      # Public HTTP — ACME HTTP-01 challenges + redirect to HTTPS.
      - "80:80"
      # Public HTTPS — the only real entry point.
      - "443:443"
      # NPM admin UI — bound to LOOPBACK only. Access via SSH tunnel:
      #   ssh -L 8181:127.0.0.1:81 root@<vps-ip>
      #   open http://localhost:8181
      # NEVER expose port 81 publicly.
      - "127.0.0.1:81:81"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# No explicit networks block — Docker Compose creates one default project
# network and puts both services on it. They reach each other by container
# name (`volt-mcp`, `nginx-proxy-manager`).

volumes:
  npm-data:
  npm-letsencrypt:
